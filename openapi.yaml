openapi: 3.1.0
info:
  title: IncuBrix Prompt-Based Video Editing Engine API
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Get Health
      description: Liveness probe returning 200 OK when service is running.
      operationId: get_health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      tags:
      - Health
      summary: Get Ready
      description: Readiness probe verifying DB, Storage, Queue, and FFmpeg binaries.
      operationId: get_ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/samples:
    get:
      tags:
      - Sessions
      summary: List Sample Media
      description: Returns list of built-in synthetic test media clips.
      operationId: list_sample_media_api_v1_samples_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/sessions:
    post:
      tags:
      - Sessions
      summary: Create Session
      description: 'Intake video via multipart upload or URL.

        Returns 202 Accepted with job_id for transcription and indexing.'
      operationId: create_session_api_v1_sessions_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_session_api_v1_sessions_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/instructions:
    post:
      tags:
      - Sessions
      summary: Apply Instruction
      description: 'Applies an editing instruction to the session''s active timeline.

        Returns 200 OK synchronously (< 2s) or 202 Accepted if async_mode is requested.'
      operationId: apply_instruction_api_v1_sessions__session_id__instructions_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/render:
    post:
      tags:
      - Sessions
      summary: Render Session
      description: 'Renders the session''s compiled timeline into the final video
        file and .otio export.

        Returns 202 Accepted with job_id.'
      operationId: render_session_api_v1_sessions__session_id__render_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RenderRequest'
              - type: 'null'
              title: Req
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}:
    get:
      tags:
      - Sessions
      summary: Get Session
      description: Returns metadata and status for a session.
      operationId: get_session_api_v1_sessions__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - Jobs
      summary: Get Job Status
      description: Returns progress (0-100), status, and result download links for
        a background job.
      operationId: get_job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/timeline:
    get:
      tags:
      - Sessions
      summary: Get Session Timeline
      description: Returns the current CompiledTimeline for the session.
      operationId: get_session_timeline_api_v1_sessions__session_id__timeline_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/sessions/{session_id}/history:
    get:
      tags:
      - Sessions
      summary: Get Session History
      description: Returns the history of EditOperations performed in this session.
      operationId: get_session_history_api_v1_sessions__session_id__history_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/files/{file_id}:
    get:
      tags:
      - Files
      summary: Get File
      description: Serves uploaded or rendered media files from local storage.
      operationId: get_file_api_v1_files__file_id__get
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_create_session_api_v1_sessions_post:
      properties:
        video_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Video Url
        file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: File
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      title: Body_create_session_api_v1_sessions_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InstructionRequest:
      properties:
        say:
          type: string
          title: Say
          description: Natural language editing prompt, e.g. 'Cut the first 30 seconds'
        answer:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer
          description: Disambiguation choice if system asked a clarification question
        async_mode:
          type: boolean
          title: Async Mode
          description: Forces asynchronous job dispatch
          default: false
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
          description: Optional webhook URL for job completion notification
      type: object
      required:
      - say
      title: InstructionRequest
    RenderRequest:
      properties:
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
          description: Webhook URL for signed completion delivery
      type: object
      title: RenderRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
