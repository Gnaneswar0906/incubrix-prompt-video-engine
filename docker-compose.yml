version: '3.8'

services:
  # Fast API HTTP Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-api
    ports:
      - "8000:8000"
    environment:
      - API_TITLE=IncuBrix Prompt-Based Video Editing Engine API
      - API_VERSION=1.0.0
      - QUEUE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=s3
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=incubrix-media
      - MINIO_SECURE=false
      - DATABASE_URL=sqlite:////app/data/incubrix.db
      - WEBHOOK_SECRET=incubrix-shared-secret-key
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - api-data:/app/data
    restart: unless-stopped

  # Background Asynchronous Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-worker
    command: ["python", "worker.py"]
    environment:
      - QUEUE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=s3
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=incubrix-media
      - MINIO_SECURE=false
      - DATABASE_URL=sqlite:////app/data/incubrix.db
      - WEBHOOK_SECRET=incubrix-shared-secret-key
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - api-data:/app/data
    restart: unless-stopped

  # Redis Job Queue Broker
  redis:
    image: redis:7-alpine
    container_name: incubrix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # MinIO S3 Object Storage
  minio:
    image: minio/minio:latest
    container_name: incubrix-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  api-data:
  minio-data:
